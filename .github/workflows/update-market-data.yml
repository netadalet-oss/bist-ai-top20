name: Update market repository

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 5-16 * * 1-5'
  push:
    branches: ["mobile/aurum-top20-pro-x"]
    paths:
      - 'tools/update_market_repository.py'
      - '.github/workflows/update-market-data.yml'
      - 'data/symbols.txt'

permissions:
  contents: write

concurrency:
  group: aurum-market-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/aurum-top20-pro-x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect provider data and build repository snapshot
        env:
          AURUM_HTTP_TIMEOUT: '18'
          AURUM_MAX_SYMBOLS: '700'
          AURUM_MIN_SYMBOLS: '100'
        run: python tools/update_market_repository.py
      - name: Validate snapshot
        run: |
          python - <<'PY'
          import json
          with open('data/latest.json', encoding='utf-8') as f:
              d=json.load(f)
          assert d.get('ok') is True
          assert d.get('universeSize',0) >= 100
          assert len(d.get('top20',[])) <= 20
          assert d.get('providerOrder') == ['ISYATIRIM','ISYATIRIM_LIVE','YAHOO','YAHOO_QUOTE','BIGPARA','STOOQ']
          PY
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- data/latest.json; then
            echo 'No snapshot change.'
            exit 0
          fi
          git config user.name 'aurum-market-bot'
          git config user.email 'aurum-market-bot@users.noreply.github.com'
          git add data/latest.json
          git commit -m 'data: refresh market repository snapshot'
          git push origin HEAD:mobile/aurum-top20-pro-x
