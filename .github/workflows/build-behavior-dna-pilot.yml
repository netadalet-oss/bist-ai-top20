name: Build Behavior DNA Pilot

on:
  workflow_dispatch:
  push:
    branches: [behavior-dna]
    paths:
      - '.github/workflows/build-behavior-dna-pilot.yml'
      - 'scripts/run_pilot_behavior_dna.py'
      - 'scripts/run_pilot_behavior_dna_resilient.py'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/build-behavior-dna-pilot.yml'
      - 'scripts/run_pilot_behavior_dna.py'
      - 'scripts/run_pilot_behavior_dna_resilient.py'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'

permissions:
  contents: read

actions:

concurrency:
  group: behavior-dna-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - name: Checkout behavior-dna
        uses: actions/checkout@v4
        with:
          ref: behavior-dna

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Restore verified Yahoo cache
        uses: actions/cache@v4
        with:
          path: artifacts/behavior_dna/raw
          key: behavior-dna-yahoo-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            behavior-dna-yahoo-${{ runner.os }}-

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Build 100-behavior real-data database
        run: python scripts/run_pilot_behavior_dna_resilient.py

      - name: Validate acceptance criteria
        run: |
          test -s artifacts/behavior_dna/behavior_dna.parquet
          test -s artifacts/behavior_dna/event_study.parquet
          test -s artifacts/behavior_dna/behavior_dna.sqlite
          test -s artifacts/behavior_dna/BehaviorDNA.xlsx
          test -s artifacts/behavior_dna/source_failures.csv
          python - <<'PY'
          import json
          from pathlib import Path
          import openpyxl
          import pandas as pd

          root = Path('artifacts/behavior_dna')
          report = json.loads((root / 'run_report.json').read_text())
          assert report['stock_count'] >= 10, report
          assert report['market_behavior_count'] >= 100, report
          assert report['behavior_definition_count'] == 100, report
          assert report['independent_behavior_family_count'] == 20, report
          assert report['threshold_variant_count'] == 80, report
          assert report['stock_behavior_profile_count'] >= 1000, report
          assert report['event_count'] > 0 and report['behavior_rows'] > 0, report
          profiles = pd.read_parquet(root / 'behavior_dna.parquet')
          events = pd.read_parquet(root / 'event_study.parquet')
          assert len(profiles) >= 1000 and profiles['symbol'].nunique() >= 10
          assert len(events) > 0
          assert {'sector_data_available','sector_index_used','sector_fallback_level'}.issubset(events.columns)
          required = {'README','Market_Behaviors_100','Stock_Universe','Event_Dates','Behavior_DNA','Event_Study','Stock_Summaries','Sector_Summaries','Market_Regimes','Coverage','Missing_Data','Data_Quality','Sources','Methodology','SHA256SUMS'}
          workbook = openpyxl.load_workbook(root / 'BehaviorDNA.xlsx', read_only=True)
          assert required.issubset(workbook.sheetnames), required - set(workbook.sheetnames)
          assert (root / 'BehaviorDNA.xlsx').stat().st_size > 10000
          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY

      - name: Upload Behavior DNA deliverables
        uses: actions/upload-artifact@v4
        with:
          name: BehaviorDNA-100-behaviors-${{ github.run_number }}
          path: |
            artifacts/behavior_dna/behavior_dna.parquet
            artifacts/behavior_dna/event_study.parquet
            artifacts/behavior_dna/events.parquet
            artifacts/behavior_dna/stocks.parquet
            artifacts/behavior_dna/market.parquet
            artifacts/behavior_dna/behavior_dna.sqlite
            artifacts/behavior_dna/BehaviorDNA.xlsx
            artifacts/behavior_dna/coverage_report.csv
            artifacts/behavior_dna/missing_data_report.csv
            artifacts/behavior_dna/source_failures.csv
            artifacts/behavior_dna/run_report.json
            artifacts/behavior_dna/SHA256SUMS.json
            artifacts/behavior_dna/SHA256SUMS.xlsx
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure logs and partial raw cache
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BehaviorDNA-failure-${{ github.run_number }}
          path: artifacts/behavior_dna/
          if-no-files-found: warn
          retention-days: 14
