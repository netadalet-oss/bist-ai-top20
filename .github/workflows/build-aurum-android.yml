name: Build Aurum Android APK
on:
  push:
    branches: ["mobile/aurum-top20-pro-x"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build signed installable debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify package, manifest and APK signatures
        working-directory: android-app
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK"
          sha256sum "$APK" > app/build/outputs/apk/debug/Aurum-Top20-Pro-X-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Aurum-Top20-Pro-X-installable
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/apk/debug/Aurum-Top20-Pro-X-SHA256.txt
